import { serve } from "https://deno.land/std@0.177.0/http/server.ts";

serve(async (req) => {
  const payload = await req.json();
  const data = payload.record;

  if (data.estado_solicitud !== "Pendiente de Firma") {
    return new Response("No se requiere generar código", { status: 200 });
  }

  const supabaseUrl = Deno.env.get("SUPABASE_URL")!;
  const serviceKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!;
  const anonKey = Deno.env.get("SUPABASE_ANON_KEY")!;

  const codigo = data.codigo_barras;
  const id = data.id_profesional_unico;
  const bucket = "id-barcode";
  const filename = `${codigo}.png`;
  const filePath = `${bucket}/${filename}`;

  // 1. Descargar la imagen del código de barras
  const barcodeResponse = await fetch(`https://barcodeapi.org/api/128/${codigo}`);
  if (!barcodeResponse.ok) {
    return new Response("Error descargando código de barras", { status: 500 });
  }

  const imageBuffer = new Uint8Array(await barcodeResponse.arrayBuffer());

  // 2. Subir a Supabase Storage
  const upload = await fetch(`${supabaseUrl}/storage/v1/object/${filePath}`, {
    method: "PUT",
    headers: {
      "Authorization": `Bearer ${serviceKey}`,
      "Content-Type": "image/png"
    },
    body: imageBuffer
  });

  if (!upload.ok) {
    return new Response("Error subiendo imagen a Supabase", { status: 500 });
  }

  // 3. Construir la URL pública
  const publicUrl = `${supabaseUrl}/storage/v1/object/public/${filePath}`;

  // 4. Actualizar el campo url_codigo_barras en la tabla
  const update = await fetch(`${supabaseUrl}/rest/v1/profesionales_sanitarios?id_profesional_unico=eq.${id}`, {
    method: "PATCH",
    headers: {
      "apikey": anonKey,
      "Authorization": `Bearer ${serviceKey}`,
      "Content-Type": "application/json",
      "Prefer": "return=representation"
    },
    body: JSON.stringify({
      url_codigo_barras: publicUrl
    })
  });

  if (!update.ok) {
    return new Response("Error actualizando URL en la tabla", { status: 500 });
  }

  return new Response(JSON.stringify({ url: publicUrl }), {
    headers: { "Content-Type": "application/json" },
    status: 200
  });
});
